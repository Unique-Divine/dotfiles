# Positive patterns only: paths-filter combines patterns with OR.
bun:
  - '**/*.{ts,tsx,js,mjs,cjs}'
  - 'package.json'
  - 'bun.lock'
  - '.bun-version'
  - '**/tsconfig*.json'
  - 'bunfig.toml'
  - '.nvmrc'
  - 'zsh/**'
  - 'bin/**'
  - 'codex/**'
  - 'cursor/**'
  - 'windows/sharex/**'
  - 'symlinks.sh'
  - 'justfile'
  - 'herdr-release/**'
  - '.github/filters.yml'
  - '.github/workflows/ci.yml'
rust:
  - 'Cargo.{toml,lock}'
  - 'rust-toolchain{,.toml}'
  - '.cargo/**'
  - '{clipboard,ud}/**/*.{rs,toml,sh}'
  - '{clipboard,ud}/{tests,fixtures}/**'
  - 'bin/legacy-pb{copy,paste}'
  - 'zsh/{bashlib.sh,quick.sh,ud/shell.sh}'
  - 'justfile'
  - '.github/filters.yml'
  - '.github/workflows/ci.yml'
herdr_native:
  - 'herdr/Cargo.{toml,lock}'
  - 'herdr/rust-toolchain{,.toml}'
  - 'herdr/.cargo/**'
  - 'herdr/build.rs'
  - 'herdr/{src,crates,vendor}/**'
  - 'herdr/assets/**'
  - 'herdr/docs/next/api/herdr-api.schema.json'
  - 'herdr/skills/herdr/SKILL.md'
  - 'herdr/distribution/install.ps1'
  - 'herdr/{README.md,LICENSE}'
  - 'herdr/scripts/package_windows_conpty.ps1'
  - '.github/workflows/herdr-native-build.yml'
  - '.github/filters.yml'
  - '.github/workflows/ci.yml'
herdr_tmux:
  - 'herdr-tmux/{src,tests,fixtures,assets}/**'
  - 'herdr-tmux/Cargo.{toml,lock}'
  - 'herdr-tmux/{build.rs,rust-toolchain,rust-toolchain.toml}'
  - 'herdr-tmux/.cargo/**'
  - 'herdr-tmux/{README.md,LICENSE,CHANGELOG.md,RELEASING.md,herdr-plugin.toml,justfile}'
  - '.github/filters.yml'
  - '.github/workflows/ci.yml'
