name: Changed components
on:
  workflow_call:
    outputs:
      bun:
        value: ${{ jobs.changes.outputs.bun }}
      rust:
        value: ${{ jobs.changes.outputs.rust }}
      herdr_native:
        value: ${{ jobs.changes.outputs.herdr_native }}
      herdr_tmux:
        value: ${{ jobs.changes.outputs.herdr_tmux }}
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.paths.outputs.bun == 'true' || steps.full.outputs.enabled == 'true' }}
      rust: ${{ steps.paths.outputs.rust == 'true' || steps.full.outputs.enabled == 'true' }}
      herdr_native: ${{ steps.paths.outputs.herdr_native == 'true' || steps.full.outputs.enabled == 'true' }}
      herdr_tmux: ${{ steps.paths.outputs.herdr_tmux == 'true' || steps.full.outputs.enabled == 'true' }}
    steps:
      - id: full
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/herdr-ud/') }}
        run: echo "enabled=$FULL" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.full.outputs.enabled != 'true'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        if: steps.full.outputs.enabled != 'true'
        id: paths
        with:
          filters: .github/filters.yml
          # PRs use the PR API; pushes compare against the previous commit.
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
