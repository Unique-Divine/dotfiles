name: Cross Hub
on:
  pull_request:
    paths:
      - '.github/workflows/cross-hub.yml'
      - 'bin/wsl-cross-hub'
      - 'windows/wsl-cross-hub/**'
      - 'nvim/**'
      - 'justfile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q windows/wsl-cross-hub
  desktop:
    name: Windows desktop package smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and exercise the package in an isolated directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'cross-hub-package'
          & .\windows\wsl-cross-hub\build-desktop.ps1 -OutputDirectory $package -RuntimeIdentifier win-x64
          $exe = Join-Path $package 'wsl-cross-hub-desktop.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Cross Hub self-test failed: $($test.ExitCode)" }
          & .\windows\wsl-cross-hub\desktop-package.test.ps1
