name: Herdr UD release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["herdr-ud/*"]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: herdr-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  validate:
    needs: changes
    if: github.repository == 'Unique-Divine/dotfiles' && (needs.changes.outputs.bun == 'true' || needs.changes.outputs.herdr_native == 'true')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: taiki-e/install-action@just
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Validate release candidate and Cargo versions
        id: candidate
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/herdr-ud/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version="$(bun run herdr-release/publish.ts validate "$RELEASE_TAG")"
          printf 'version=%s\ntag=herdr-ud/v%s\nsource_sha=%s\n' \
            "$version" "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: bun test herdr-release
  build:
    needs: [changes, validate]
    if: needs.changes.outputs.herdr_native == 'true'
    uses: ./.github/workflows/herdr-native-build.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      release_tag: ${{ needs.validate.outputs.tag }}
  prepare:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: herdr-*
          path: release-assets
          merge-multiple: true
      - name: Prepare checksums and source metadata without publishing
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bun run herdr-release/publish.ts prepare "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-ud-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_sha }}
          path: release-assets/
          if-no-files-found: error
  publish:
    if: github.repository == 'Unique-Divine/dotfiles' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/herdr-ud/')
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: herdr-ud-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_sha }}
          path: release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bun run herdr-release/publish.ts publish "$RELEASE_TAG"
