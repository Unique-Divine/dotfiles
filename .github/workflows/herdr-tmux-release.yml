name: Herdr tmux release
on:
  pull_request:
    paths:
      - herdr-tmux/**
      - .github/workflows/herdr-tmux-release.yml
  push:
    tags: ["herdr-tmux/v*"]
permissions:
  contents: read
concurrency:
  group: herdr-tmux-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: herdr-tmux
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - name: Confirm release tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Check crate and tag versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps --locked |
            jq -er '.packages[] | select(.name == "herdr-tmux") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "herdr-tmux/v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match herdr-tmux/v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check plugin manifest version and executable paths
        run: cargo test --locked plugin::tests::manifest_versions_and_paths_match
  build:
    name: Package Herdr tmux (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: herdr-tmux
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build, archive, and smoke-test the locked binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$BUILD_TARGET"
          archive="$RUNNER_TEMP/herdr-tmux-v$VERSION-$BUILD_TARGET.tar.gz"
          tar -czf "$archive" -C "target/$BUILD_TARGET/release" herdr-tmux
          test "$(tar -tzf "$archive")" = herdr-tmux
          smoke_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$smoke_dir"
          test "$("$smoke_dir/herdr-tmux" --version)" = "herdr-tmux $VERSION"
          "$smoke_dir/herdr-tmux" plugin register --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-tmux-target-${{ matrix.target }}
          path: ${{ runner.temp }}/herdr-tmux-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true
  bundle:
    name: Assemble release bundle
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: herdr-tmux-target-*
          path: release-assets
          merge-multiple: true
      - name: Verify archive names and write checksums
        working-directory: release-assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archives=(
            "herdr-tmux-v$VERSION-aarch64-apple-darwin.tar.gz"
            "herdr-tmux-v$VERSION-aarch64-unknown-linux-musl.tar.gz"
            "herdr-tmux-v$VERSION-x86_64-apple-darwin.tar.gz"
            "herdr-tmux-v$VERSION-x86_64-unknown-linux-musl.tar.gz"
          )
          files=(*)
          test "${#files[@]}" -eq "${#archives[@]}"
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-tmux-release-bundle
          path: release-assets/
          if-no-files-found: error
          overwrite: true
  publish:
    name: Publish verified GitHub release
    if: github.repository == 'Unique-Divine/dotfiles' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/herdr-tmux/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: herdr-tmux-release-bundle
          path: release-assets
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.tar.gz
      - name: Upload and verify draft assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --slurp)"
          exists="$(jq -r --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag)' <<< "$releases")"
          if [[ "$exists" == "true" ]]; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing to overwrite assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
            --title "herdr-tmux ${RELEASE_TAG#herdr-tmux/v}" --notes-from-tag \
            ./*.tar.gz SHA256SUMS
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --slurp)"
          draft_id="$(jq -er --arg tag "$RELEASE_TAG" \
            '.[][] | select(.tag_name == $tag and .draft) | .id' <<< "$releases")"
          release="$(gh api "repos/$GH_REPO/releases/$draft_id")"
          jq -er '.assets[] | "\(.name) \(.digest)"' <<< "$release" | sort > uploaded-digests
          sha256sum -- *.tar.gz SHA256SUMS | awk '{print $2, "sha256:" $1}' | sort > expected-digests
          diff -u expected-digests uploaded-digests
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false
