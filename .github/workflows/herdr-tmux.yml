name: Herdr tmux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, ud/herdr-tmux]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  check:
    needs: changes
    if: needs.changes.outputs.herdr_tmux == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: herdr-tmux
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify package
        run: cargo package --locked
