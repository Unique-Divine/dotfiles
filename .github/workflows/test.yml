name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Allow concurrent runs on main but cancel stale branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: No affected tests
        if: needs.changes.outputs.bun != 'true' && needs.changes.outputs.rust != 'true'
        run: echo "No Bun or root Cargo workspace inputs changed."
      - uses: taiki-e/install-action@just
        if: needs.changes.outputs.bun == 'true' || needs.changes.outputs.rust == 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.bun == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install shell dependencies
        if: needs.changes.outputs.bun == 'true'
        run: just i-bash-ci
      - name: Install dependencies and check TypeScript
        if: needs.changes.outputs.bun == 'true'
        run: |
          bun install --frozen-lockfile
          just typecheck
          just test-bun
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - name: Test root Cargo workspace
        if: needs.changes.outputs.rust == 'true'
        run: just test-rust
