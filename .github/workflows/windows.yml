name: Windows setup

on:
  pull_request:
    paths:
      - 'windows/known-folders/**'
      - 'windows/terminal-profile/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths:
      - 'windows/known-folders/**'
      - 'windows/terminal-profile/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  profiles:
    name: Windows PowerShell 5.1 fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Terminal and PowerShell profile setup
        shell: powershell
        run: ./windows/terminal-profile/tests/Test-Sync.ps1
      - name: Verify Known Folder file migration
        shell: powershell
        run: ./windows/known-folders/tests/Test-Migration.ps1
