[workspace]
members = ["clipboard", "ud"]
# Keep the upstream Herdr submodule independent with its own Cargo.lock,
# toolchain, build configuration, and release lifecycle.
exclude = ["lib-herdr"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
