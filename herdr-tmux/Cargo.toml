[package]
name = "herdr-tmux"
version = "0.1.0"
edition = "2021"
description = "tmux-style layouts and agent pickers for Herdr, as a CLI and plugin"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/Unique-Divine/dotfiles"
homepage = "https://github.com/Unique-Divine/dotfiles/tree/main/herdr-tmux"
keywords = ["herdr", "tmux", "terminal", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "RELEASING.md",
    "herdr-plugin.toml",
    "src/**",
    "tests/**",
]

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
