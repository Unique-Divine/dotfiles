[package]
name = "herdr-tmux"
version = "0.1.0"
edition = "2021"
description = "tmux-style layout commands for Herdr"
license = "MIT"

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
