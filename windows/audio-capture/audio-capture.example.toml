# audio-capture config. The app reads the first file that exists:
#   1. --config <path>
#   2. %USERPROFILE%\.audio-capture\config.toml
#   3. audio-capture.toml next to audio-capture.exe
# Edits apply at the next recording start, except keys.toggle, which needs
# a restart (audio-capture --quit, then launch it again).

[keys]
# One global chord in herdr's syntax: ctrl, alt, shift, and win (or super,
# cmd) plus one key, such as a letter, a digit, f1 to f24, or a named key
# (space, enter, esc, minus, comma, ...). ShareX owns ctrl+f2 until the
# handover, so test on another chord.
toggle = "ctrl+alt+f2"

[pill]
# bottom-right, bottom-left, bottom-center, top-right, top-left, or
# top-center.
position = "bottom-right"
# primary, or cursor for the monitor under the mouse at recording start.
monitor = "primary"
# Recording dot color as #RRGGBB.
dot_color = "#FF453A"

[output]
# {documents}, {music}, {videos}, {desktop}, {home}, {appdata}, and
# {localappdata} are folders. Any other {token} is a .NET date format.
dir = "{documents}/ShareX/Screenshots/{yyyy-MM}"
name = "{yy-MM-dd}__{HHmmss}-audio.mp3"

[audio]
# DirectShow device for system audio (screen-capture-recorder's filter).
system = "virtual-audio-capturer"
# Which mic to record. Windows keeps two defaults, set in Sound settings:
#   "communications"  follow the Default Communication Device, the one
#                     call apps such as Zoom and Teams use
#   "default-device"  follow the Default Device, the one most other apps use
#   a device name     pin one device (see `audio-capture --list-devices`);
#                     if it's unplugged, wait for it on any USB port
#   "none"            system audio only
# In a follow mode the recording moves to whatever device Windows makes
# the default, mid-recording: the laptop mic while a USB mic is out, back
# to the USB mic when it returns, or AirPods when they connect. The pill
# shows the new device's name for a moment. "default" means
# "communications" and logs a warning.
mic = "communications"
# Path to ffmpeg.exe. Empty means PATH, then ShareX's copy.
ffmpeg = ""

[debug]
# Keep the raw session folder in %USERPROFILE%\.audio-capture\sessions
# after a successful save.
keep_session = false
